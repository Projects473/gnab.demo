DEMOS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.innerHTML='<b>'+(i+1)+'</b>'+d.t;b.onclick=()=>show(i);tabs.append(b);sel.add(new Option((i+1)+'. '+d.t,i))});
sel.onchange=()=>show(+sel.value);
function show(i,keep){i=Math.max(0,Math.min(DEMOS.length-1,i));
 [...tabs.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i));sel.value=i;
 desc.textContent=(i+1)+' of '+DEMOS.length+': '+DEMOS[i].d;view.src=urls[i];open.href=urls[i];
 if(!keep)history.replaceState(null,'','#v'+(i+1))}
const m=/^#v(\d+)$/.exec(location.hash);
show(m?+m[1]-1:DEMOS.length-1,true);
